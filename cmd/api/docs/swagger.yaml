      tags:
      - Core
  /v1/core/interactions:
    get:
      consumes:
      - application/json
      description: Returns a filtered, paginated list of interactions from the L2
        Behavioral Graph for a given entity. Used for debugging, demo, and audit purposes.
      parameters:
      - description: Entity UUID to filter by
        in: query
        name: entity_id
        required: true
        type: string
      - description: Filter by intent (e.g. book_demo)
        in: query
        name: intent
        type: string
      - description: Filter by action (e.g. send_cold_email)
        in: query
        name: action
        type: string
      - description: Filter by outcome (success|failed|pending|ignored|unknown)
        in: query
        name: outcome
        type: string
      - description: Filter by API (e.g. linkedin)
        in: query
        name: api
        type: string
      - description: Max results to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
