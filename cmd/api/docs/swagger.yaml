      description: L1 Identity Resolution. Accepts one or more identifier key-value
        pairs and returns (or creates) the canonical entity. Handles entity merges
        when multiple entities match different identifiers in the same request.
      parameters:
      - description: Resolution request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/fusemomo-api_internal_models_payload.ResolveEntityRequest'
