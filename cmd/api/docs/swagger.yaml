host: https://api.fusemomo.com
info:
  contact:
    email: team@fusemomo.com
    name: Fusemomo Support
    url: https://fusemomo.com
  description: Behavioral Intelligence for AI Agents that act through APIs.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Fusemomo API
  version: "1.0"
paths:
  /auth/login/{provider}:
    get:
      description: Redirects to Supabase OAuth for Google or GitHub
      parameters:
      - description: OAuth Provider (google or github)
        in: path
        name: provider
        required: true
        type: string
      - description: Redirect URL after login
        in: query
        name: redirect_to
        type: string
      responses:
        "307":
          description: Redirects to Supabase
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      summary: Social Login
      tags:
      - Auth
  /auth/session:
    delete:
      description: Deletes the server-side session record and clears the HttpOnly
        session cookie.
      produces:
      - application/json
      responses:
        "204":
          description: Session destroyed. Cookie cleared.
      security:
      - SessionAuth: []
      summary: Destroy the current session (logout)
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Validates a Supabase access_token (ES256 JWT), looks up the tenant
        record, creates
      parameters:
      - description: Supabase access token obtained from the Supabase client SDK
        in: body
        name: request
        required: true
        schema:
          properties:
            access_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              user:
                properties:
                  auth_user_id:
                    type: string
                  plan:
                    type: string
                  role:
                    type: string
                  tenant_id:
                    type: string
                type: object
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      summary: Create a server-side session
      tags:
      - Auth
  /health/db:
    get:
      description: Check if the database connection is alive.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      summary: Check database health
      tags:
      - Health
  /ping:
    get:
      description: Returns a simple pong message to verify the server is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ping the server
      tags:
      - Health
  /v1/admin/tenants:
    get:
      description: Returns all tenant records with current month usage stats and pagination
        support
      parameters:
      - description: Filter by plan tier (free, builder, enterprise)
        in: query
        name: plan
        type: string
      - default: 50
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fusemomo-api_internal_models_payload.AdminTenantsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      security:
      - SessionAuth: []
      summary: List all tenants (admin view)
      tags:
      - Admin
  /v1/admin/tenants/{id}:
    delete:
      description: Hard delete a tenant and all its associated data (admin only)
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      security:
      - SessionAuth: []
      summary: Delete a tenant
      tags:
      - Admin
  /v1/admin/tenants/{id}/plan:
    patch:
      consumes:
      - application/json
      description: Updates a tenant's plan tier and limits directly in the database
        (admin override)
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Plan Update Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/fusemomo-api_internal_models_payload.UpdateTenantPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      security:
      - SessionAuth: []
      summary: Manually change a tenant's plan
      tags:
      - Admin
  /v1/admin/usage/global:
    get:
      description: Aggregates usage metrics across all tenants for platform monitoring
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fusemomo-api_internal_models_payload.GlobalUsageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      security:
      - SessionAuth: []
      summary: Global usage stats
      tags:
      - Admin
  /v1/app:
    delete:
      description: Marks the currently authenticated tenant profile as deleted. This
        is irreversible via the UI.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      security:
      - SessionAuth: []
      summary: Delete tenant profile (Soft Delete)
      tags:
      - Dashboard
  /v1/app/analytics/activity-heatmap:
    get:
      description: Daily interaction counts for calendar heatmap (max 90d)
      parameters:
      - description: 7d | 30d | 90d (no 'all')
        in: query
        name: period
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
