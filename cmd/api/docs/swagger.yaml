        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/fusemomo-api_internal_utils.APIError'
      security:
      - ApiKeyAuth: []
      summary: List interactions for an entity
      tags:
      - Core
  /v1/core/interactions/batch:
    post:
      consumes:
      - application/json
      description: Atomically logs up to 100 interaction events. All items are validated
        before any insert. Duplicate external_refs are skipped (idempotent), not rejected.
        Returns 201 Created.
      parameters:
