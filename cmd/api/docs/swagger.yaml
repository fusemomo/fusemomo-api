basePath: /
definitions:
  fiber.Map:
    additionalProperties: {}
    type: object
  fusemomo-api_internal_models.BillingStatusResponse:
    properties:
      connected_api_limit:
        type: integer
      has_active_subscription:
        type: boolean
      monthly_interaction_limit:
        type: integer
      monthly_resolution_limit:
        type: integer
      plan:
        type: string
    type: object
  fusemomo-api_internal_models.CheckoutRequest:
    properties:
      price_id:
        type: string
    required:
    - price_id
    type: object
  fusemomo-api_internal_models.CheckoutResponse:
    properties:
      checkout_url:
